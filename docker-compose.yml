services:
  mysql:
    image: mysql:8
    container_name: skirmish-mysql
    environment:
      MYSQL_DATABASE: skirmish
      MYSQL_USER: app
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: